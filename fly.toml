cat > fly.toml <<'EOF'
app = "host-otmeba"
primary_region = "fra"

[build]

[env]
  PORT = "8080"
  HOSTNAME = "0.0.0.0"
  NODE_ENV = "production"
  OMNIROUTE_DATA_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "omniroute_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
EOF

grep -n "source" fly.toml

flyctl deploy -a host-otmeba \
  --image registry.fly.io/host-otmeba:deployment-f91ed9822028d8e2f73d3627bad6adaa \
  --depot-scope=app \
  --config ./fly.toml
